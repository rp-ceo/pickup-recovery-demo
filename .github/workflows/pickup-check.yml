name: Check pickup recovery
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      example:
        description: Fictional return to replay
        required: false
        type: string
        default: P101
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install time zone data
        run: python -m pip install -r requirements.txt
      - name: Check the policy
        run: python -B -m unittest discover -s agent
      - name: Check that the replay matches the current policy
        run: |
          python -B review/build_view.py
          git diff --exit-code -- review/Pickup_Operations.html
      - name: Show the recorded decisions and calls
        env:
          PICKUP_EXAMPLE: ${{ inputs.example || 'P101' }}
        run: python -B agent/demo.py "$PICKUP_EXAMPLE"
